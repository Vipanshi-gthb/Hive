server:
  port: 8080
  error:
    # Disable the whitelabel error page — GlobalExceptionHandler owns all error responses.
    # These settings suppress any accidental leakage through Spring Boot's /error fallback.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

spring:
  application:
    name: hive-cortex-backend

  # ---------------------------------------------------------------------------
  # DataSource — all credentials are read from environment variables.
  # Never hardcode values here. See .env.example for required variable names.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail fast on startup if the DB is unreachable (vs. lazy connection failure)
      initialization-fail-timeout: 5000
      connection-timeout: 10000
      maximum-pool-size: 10

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ddl-auto=validate: Hibernate checks the schema matches entities on startup
  # and fails with a clear error if there is a mismatch.
  # Flyway (added in Prompt 007) will own all DDL — never use update/create here.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ---------------------------------------------------------------------------
  # Flyway (schema migrations) — configured in Prompt 007.
  # Disabled here so the app can start without migration scripts in place yet.
  # Remove this block and add Flyway dependency in Prompt 007.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true

# ------------------------------------------------------------------------------
# CORS — scoped to the known frontend origin. Never use * in production.
# Override via CORS_ALLOWED_ORIGIN environment variable.
# ------------------------------------------------------------------------------
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ------------------------------------------------------------------------------
# JWT Configuration — secret sourced from JWT_SECRET env var.
# Defaults provided for local development convenience.
# ------------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

